name: Build Iranian Hardcore

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven and save log
      run: |
        mvn -B clean package -DskipTests -e > maven.log 2>&1 || true
        cat maven.log
        echo "===TRY BUILD AGAIN==="
        mvn -B clean package -DskipTests || true
        ls -lh target/ 2>&1 || echo "no target"
    - name: Upload log artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maven-log-${{ github.run_id }}
        path: maven.log
    - name: Upload Jar Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0
        path: target/*.jar

  build-gradle:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: |
        gradle build --no-daemon --stacktrace > gradle.log 2>&1 || true
        cat gradle.log
        gradle build --no-daemon --stacktrace || true
        ls -lh build/libs/ 2>&1 || echo "no libs"
    - name: Upload gradle log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-log-${{ github.run_id }}
        path: gradle.log
    - name: Upload Jar Artifact Gradle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0-Gradle
        path: build/libs/*.jar
