name: Build Iranian Hardcore

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Check Java and Maven
      run: |
        java -version
        mvn -version
        ls -la
    - name: Build with Maven capture log
      run: |
        mvn -B clean package -DskipTests -e > maven.log 2>&1 || true
        echo "=== MAVEN LOG START ==="
        cat maven.log
        echo "=== MAVEN LOG END ==="
        ls -lh target/ 2>&1 || echo "no target"
        mvn -B clean package -DskipTests
    - name: Upload Jar Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0
        path: target/*.jar
    - name: Save log to branch on failure
      if: failure()
      run: |
        cat maven.log
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git checkout --orphan build-logs
        git rm -rf . || true
        cp $GITHUB_WORKSPACE/maven.log ./maven-${{ github.run_id }}.log || cp maven.log ./maven-${{ github.run_id }}.log || echo "no log" > ./maven-${{ github.run_id }}.log
        ls -la
        git add .
        git commit -m "log ${{ github.run_id }}"
        git push origin build-logs --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gradle:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle capture
      run: |
        gradle build --no-daemon --stacktrace > gradle.log 2>&1 || true
        echo "=== GRADLE LOG START ==="
        cat gradle.log
        echo "=== GRADLE LOG END ==="
        gradle build --no-daemon --stacktrace
    - name: Upload Jar Artifact Gradle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0-Gradle
        path: build/libs/*.jar
    - name: Save log to branch on failure
      if: failure()
      run: |
        cat gradle.log
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git checkout --orphan build-logs-gradle
        git rm -rf . || true
        cp $GITHUB_WORKSPACE/gradle.log ./gradle-${{ github.run_id }}.log || cp gradle.log ./gradle-${{ github.run_id }}.log || echo "no log" > ./gradle-${{ github.run_id }}.log
        ls -la
        git add .
        git commit -m "log ${{ github.run_id }}"
        git push origin build-logs-gradle --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
