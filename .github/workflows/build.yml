name: Build Iranian Hardcore

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B clean package -DskipTests
    - name: List target
      run: ls -lh target/
    - name: Upload Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0
        path: target/*.jar
    - name: Push Jar to repo for direct download
      if: success()
      run: |
        JAR=$(ls target/*.jar | head -n1)
        echo "Jar: $JAR"
        cp $JAR ./IranianHardcore-3.5.0.jar
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add -f IranianHardcore-3.5.0.jar
        git commit -m "Update Jar ${{ github.run_id }} - ready for direct download" || echo "No changes"
        git push origin main || echo "Push failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload to Release
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
