name: Build Iranian Hardcore

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: |
        set -o pipefail
        mvn -B clean package -DskipTests -e 2>&1 | tee maven.log
        ls -lh target/
    - name: Upload Jar Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0
        path: target/*.jar
    - name: Upload log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: maven-log-${{ github.run_id }}
        path: maven.log
    - name: Push log to repo via API on failure
      if: failure()
      run: |
        echo "Pushing log via API..."
        LOG_B64=$(base64 -w 0 maven.log | tr -d '\n')
        # Create file in logs/ directory on main branch via API
        curl -s -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/contents/logs/maven-${{ github.run_id }}.log \
          -d "{\"message\":\"Add build log ${{ github.run_id }}\",\"content\":\"$LOG_B64\"}" || echo "Failed to push log via API"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload to Release
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gradle:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: |
        set -o pipefail
        gradle build --no-daemon --stacktrace 2>&1 | tee gradle.log
        ls -lh build/libs/
    - name: Upload Jar Artifact Gradle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0-Gradle
        path: build/libs/*.jar
    - name: Upload log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-log-${{ github.run_id }}
        path: gradle.log
    - name: Push log to repo via API on failure
      if: failure()
      run: |
        LOG_B64=$(base64 -w 0 gradle.log | tr -d '\n')
        curl -s -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/contents/logs/gradle-${{ github.run_id }}.log \
          -d "{\"message\":\"Add gradle log ${{ github.run_id }}\",\"content\":\"$LOG_B64\"}" || echo "Failed to push gradle log"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload to Release Gradle
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
