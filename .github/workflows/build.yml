name: Build Iranian Hardcore

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: |
        set -o pipefail
        mvn -B clean package -DskipTests 2>&1 | tee maven.log
        ls -lh target/
    - name: Upload Jar Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0
        path: target/*.jar
    - name: Create issue with log on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let log = '';
          try {
            log = fs.readFileSync('maven.log', 'utf8');
          } catch(e) {
            log = 'No log file: ' + e.message;
          }
          log = log.substring(0, 60000);
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `❌ Maven build failed ${context.runId}`,
            body: "```\n" + log + "\n```"
          });
    - name: Upload to Release
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gradle:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: |
        set -o pipefail
        gradle build --no-daemon 2>&1 | tee gradle.log
        ls -lh build/libs/
    - name: Upload Jar Artifact Gradle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0-Gradle
        path: build/libs/*.jar
    - name: Create issue with log on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let log = '';
          try {
            log = fs.readFileSync('gradle.log', 'utf8');
          } catch(e) {
            log = 'No log: ' + e.message;
          }
          log = log.substring(0, 60000);
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `❌ Gradle build failed ${context.runId}`,
            body: "```\n" + log + "\n```"
          });
    - name: Upload to Release Gradle
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
