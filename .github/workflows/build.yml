name: Build Iranian Hardcore

on:
  push:
    branches: [ main, arena/* ]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: |
        mvn -B clean package -DskipTests 2>&1 | tee build.log
        echo "Exit code: ${PIPESTATUS[0]}" | tee -a build.log
        ls -lh target/ | tee -a build.log
        echo "=== JAR LIST ===" | tee -a build.log
        ls -lh target/*.jar 2>&1 | tee -a build.log
        exit ${PIPESTATUS[0]}
    - name: List target
      if: always()
      run: |
        ls -lh target/ || echo "No target"
        cat build.log | tail -n 500
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
    - name: Commit build log to repo
      if: always()
      continue-on-error: true
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        cp build.log ./build.log || true
        git add -f build.log || true
        git commit -m "Build log ${{ github.run_id }} - ${{ job.status }}" || echo "No changes"
        git pull --rebase origin ${{ github.ref_name }} || echo "Pull failed"
        git push origin ${{ github.ref_name }} || echo "Push log failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create issue with build log on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let log = '';
          try {
            log = fs.readFileSync('build.log', 'utf8');
          } catch (e) {
            log = 'Could not read build.log: ' + e.message;
          }
          if (log.length > 60000) {
            log = log.substring(log.length - 60000);
          }
          const title = `Build failed for ${context.sha.substring(0,7)} - run ${context.runId}`;
          const body = `**Branch:** ${context.ref}\n**Commit:** ${context.sha}\n**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Build log:**\n\`\`\`\n${log}\n\`\`\``;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['build-failed']
          });
    - name: Upload Jar Artifact v5.1.0
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-5.1.0
        path: target/*.jar
        if-no-files-found: warn
    - name: Push Jar and ResourcePack to repo for direct download
      if: always()
      continue-on-error: true
      run: |
        ls -lh target/ || echo "No target"
        JAR=$(ls target/*.jar 2>/dev/null | head -n1)
        if [ -z "$JAR" ]; then
          echo "No Jar found!"
          exit 0
        fi
        echo "Jar: $JAR"
        cp $JAR ./IranianHardcore-5.1.0.jar || true
        cp $JAR ./IranianHardcore-5.0.0.jar || true
        cp $JAR ./IranianHardcore-4.0.0.jar || true
        if [ -f resourcepack/IranianHardcore-ResourcePack.zip ]; then
          cp resourcepack/IranianHardcore-ResourcePack.zip ./IranianHardcore-ResourcePack.zip || true
        fi
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add -f IranianHardcore-5.1.0.jar IranianHardcore-5.0.0.jar IranianHardcore-4.0.0.jar IranianHardcore-ResourcePack.zip resourcepack/IranianHardcore-ResourcePack.zip || true
        git commit -m "Update Jar v5.1.0 VocalSpeech+Architecture+Textures+Models+AternosOptimization ${{ github.run_id }}" || echo "No changes"
        git pull --rebase origin ${{ github.ref_name }} || echo "Pull failed"
        git push origin ${{ github.ref_name }} || git push origin ${{ github.ref_name }} --force || echo "Push failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload to Release
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/*.jar
          resourcepack/IranianHardcore-ResourcePack.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
