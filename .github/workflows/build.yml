name: Build Iranian Hardcore

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: |
        set -o pipefail
        mvn -B clean package -DskipTests -e 2>&1 | tee maven.log
        ls -lh target/
    - name: Upload Jar Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0
        path: target/*.jar
    - name: Push log via gh api on failure
      if: failure()
      run: |
        echo "Attempting to push log via gh api..."
        LOG_B64=$(base64 -w 0 maven.log)
        echo "Log size $(wc -c < maven.log) bytes, b64 $(echo $LOG_B64 | wc -c)"
        gh api repos/${{ github.repository }}/contents/logs/maven-${{ github.run_id }}.log \
          --method PUT \
          --field message="Add maven log ${{ github.run_id }}" \
          --field content="$LOG_B64" || echo "gh api failed"
        echo "Done"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload to Release
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gradle:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: |
        set -o pipefail
        gradle build --no-daemon --stacktrace 2>&1 | tee gradle.log
        ls -lh build/libs/
    - name: Upload Jar Artifact Gradle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: IranianHardcore-3.5.0-Gradle
        path: build/libs/*.jar
    - name: Push log via gh api on failure
      if: failure()
      run: |
        LOG_B64=$(base64 -w 0 gradle.log)
        gh api repos/${{ github.repository }}/contents/logs/gradle-${{ github.run_id }}.log \
          --method PUT \
          --field message="Add gradle log ${{ github.run_id }}" \
          --field content="$LOG_B64" || echo "gh api failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload to Release Gradle
      if: github.event_name == 'release' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
