name: IranianHardcore
version: 3.5.0
main: ir.iranian.hardcore.IranianHardcorePlugin
api-version: 1.12
author: IranianTeam
authors: [Amir, IranianHardcoreDev, TeamMelli, TarikhIran, AghvamIran]
description: پلاگین هاردکور ایرانی 3.5 - هر بایوم یک قوم ایرانی - 14 قوم ایرانی (فارس، آذری، کرد، لر، بلوچ، عرب خوزستان، ترکمن، گیلک، مازنی، بختیاری، قشقایی، بندری، خراسانی، سیستانی) با قابلیت‌های مخصوص + 16 دانجن تاریخی + 8 سازه ایرانی + بازار ایرانی + روستاهای ایرانی - کاملا فارسی - انتخاب نژاد اول ورود - 🇮🇷 خلیج همیشه فارس
website: https://github.com/amirragaby110-glitch/plugin-1.12.2-minecraft-iranian
prefix: IranianHardcore

# دستورات - کاملا فارسی - نسخه 3.5 هر بایوم یک قوم ایرانی
commands:
  race:
    description: مدیریت اقوام ایرانی - هر بایوم یک قوم - 14 قوم ایرانی با قابلیت مخصوص - انتخاب اول ورود
    usage: /race <choose|info|change|list|help|admin> - دستور قوم ایرانی
    aliases: [nezhad, نژاد, reghad, qowm, قوم, aghvam, اقوام, tribe]
  hardcore:
    description: دستورات ادمین هاردکور ایرانی - سخت‌ترین حالت RLCraft
    usage: /hardcore <reload|info|setrace|reset> - دستورات ادمین
    aliases: [hc, sakht, سخت]
  dungeon:
    description: مدیریت 16 دانجن تاریخی ایران - هر بایوم یک دانجن - تخت جمشید، الموت، ارگ بم، پاسارگاد، بیستون، نقش رستم، تخت سلیمان و...
    usage: /dungeon <list|generate|teleport|clear|bazaar|caravanserai|chaikhaneh|abanbar> - دانجن ایرانی
    aliases: [dangeon, دانجن, irandungeon, iran, تختجمشید, dungeons]
  bazaar:
    description: بازار ایرانی - خرید و فروش آیتم‌های ایرانی با سکه دریک هخامنشی - کاملا فارسی - مثل بازار تهران
    usage: /bazaar [open|build|help] - بازار ایرانی
    aliases: [bazar, بازار, shop, فروشگاه, store, مغازه, bazarirani]

# پرمیشن‌ها - کاملا فارسی - نسخه 3.5 هر بایوم یک قوم
permissions:
  iranianhardcore.*:
    description: دسترسی به تمام قابلیت‌های ایرانی - ادمین کل
    default: op
    children:
      iranianhardcore.race.*: true
      iranianhardcore.hardcore.*: true
      iranianhardcore.dungeon.*: true
      iranianhardcore.bazaar.*: true
      iranianhardcore.admin: true
      iranianhardcore.bypass.*: true
  iranianhardcore.race.*:
    description: تمام پرمیشن‌های اقوام ایرانی - هر بایوم یک قوم
    default: true
    children:
      iranianhardcore.race.choose: true
      iranianhardcore.race.info: true
      iranianhardcore.race.change: true
  iranianhardcore.race.choose:
    description: انتخاب قوم ایرانی - اول ورود
    default: true
  iranianhardcore.race.info:
    description: دیدن اطلاعات قوم ایرانی و قابلیت‌ها
    default: true
  iranianhardcore.race.change:
    description: تغییر قوم ایرانی (هر 7 روز بازی)
    default: true
  iranianhardcore.race.admin:
    description: مدیریت قوم دیگران - ادمین
    default: op
  iranianhardcore.hardcore.*:
    description: پرمیشن‌های هاردکور ایرانی
    default: op
    children:
      iranianhardcore.hardcore.reload: true
      iranianhardcore.hardcore.info: true
      iranianhardcore.hardcore.setrace: true
  iranianhardcore.hardcore.reload:
    description: ریلود کانفیگ ایرانی
    default: op
  iranianhardcore.hardcore.info:
    description: اطلاعات هاردکور ایرانی
    default: op
  iranianhardcore.hardcore.setrace:
    description: تنظیم قوم بازیکن دیگر
    default: op
  iranianhardcore.dungeon.*:
    description: تمام پرمیشن‌های 16 دانجن ایرانی
    default: op
    children:
      iranianhardcore.dungeon.list: true
      iranianhardcore.dungeon.generate: true
      iranianhardcore.dungeon.teleport: true
      iranianhardcore.dungeon.admin: true
  iranianhardcore.dungeon.list:
    description: دیدن لیست 16 دانجن ایرانی
    default: true
  iranianhardcore.dungeon.generate:
    description: ساخت دانجن ایرانی در هر بایوم
    default: op
  iranianhardcore.dungeon.teleport:
    description: تلپورت به دانجن ایرانی
    default: true
  iranianhardcore.dungeon.admin:
    description: مدیریت دانجن‌های ایرانی - ادمین
    default: op
  iranianhardcore.dungeon:
    description: دسترسی به دستور دانجن ایرانی
    default: op
  iranianhardcore.bazaar.*:
    description: تمام پرمیشن‌های بازار ایرانی
    default: true
    children:
      iranianhardcore.bazaar.open: true
      iranianhardcore.bazaar.build: true
  iranianhardcore.bazaar.open:
    description: باز کردن بازار ایرانی
    default: true
  iranianhardcore.bazaar.build:
    description: ساخت سازه بازار ایرانی
    default: op
  iranianhardcore.bazaar:
    description: دسترسی به بازار ایرانی
    default: true
  iranianhardcore.admin:
    description: ادمین کامل ایرانی - تمام دسترسی‌ها
    default: op
  iranianhardcore.bypass.*:
    description: دور زدن محدودیت‌های ایرانی
    default: op
    children:
      iranianhardcore.bypass.bedcooldown: true
      iranianhardcore.bypass.racecooldown: true
      iranianhardcore.bypass.hardcore: true
  iranianhardcore.bypass.bedcooldown:
    description: دور زدن کولدان تخت ایرانی
    default: op
  iranianhardcore.bypass.racecooldown:
    description: دور زدن کولدان تغییر قوم ایرانی
    default: op
  iranianhardcore.bypass.hardcore:
    description: دور زدن سختی‌های ایرانی
    default: op
