name: IranianHardcore
version: 5.4.0
main: ir.iranian.hardcore.IranianHardcorePlugin
api-version: 1.12
author: IranianTeam
authors: [Amir, IranianHardcoreDev, TeamMelli, TarikhIran, AghvamIran]
description: Plugin Hardcore Irani v5.4 Finglish - Zoorkhaneh Bastani, Pahlavani, Akvan Div, Qanat Kavir, Atashkadeh, Silk Road, 14 ghom Irani, 30 dungeon, 900 shamshir, 500 ghaza - Safe for Aternos
website: https://github.com/amirragaby110-glitch/plugin-1.12.2-minecraft-iranian
prefix: IranianHardcore

commands:
  race:
    description: Modiriat aghvame Irani - Har biome yek ghom - 14 ghom Irani ba ghabeliat makhsus - Finglish
    usage: /race <choose|info|change|list|help|admin>
    aliases: [nezhad, reghad, qowm, aghvam, tribe, ghom]
  hardcore:
    description: Dastorat admin hardcore Irani
    usage: /hardcore <reload|info|setrace|reset>
    aliases: [hc, sakht]
  dungeon:
    description: Modiriat 30 dungeon tarikhi va boss fight haye 3 marhaleie Iran
    usage: /dungeon <list|generate|teleport|clear|bazaar|caravanserai|chaikhaneh|abanbar|boss>
    aliases: [dangeon, irandungeon, iran, takhtejamshid, dungeons]
  bazaar:
    description: Bazar Irani - Kharid va forosh item haye Irani ba sekke Derik Hakhamaneshi
    usage: /bazaar [open|build|help]
    aliases: [bazar, shop, store, bazarirani]
  iranian:
    description: Dastor asli Iranian Hardcore v5.0 - Teshnegi, Mashk Ab, Shamshirha, Ghaza, Itemha, Mobha, Dungeons, Weather
    usage: /iranian <thirst|drink|mashk|canteen|cleanwater|dirtywater|sword|food|item|dungeon|villager|spawnmob|boss|weather|resourcepack|help>
    aliases: [iran, irani, persian, hardcoreirani]
  army:
    description: Modiriat-e Artesh va Sepah-e Hakhamaneshi - Tabdil-e Villager be Sarbaz
    usage: /army [gui|follow|stay|guard|attack|formation|list]
    aliases: [artesh, sepah, soldier, soldiers]
  calendar:
    description: Taghvim-e Khorshidi va Jashn-haye Bastani-ye Iran (Nowruz, Yalda, Mehregan)
    usage: /calendar [gui]
    aliases: [taghvim, tarikh, jalali, persiancalendar]
  civilization:
    description: Pishraft-e Tamaddon-e Iran az Mohajer ta Shahanshahi-ye Hakhamaneshi
    usage: /civilization [gui|upgrade]
    aliases: [civ, tamaddon, empire, shahanshahi]

permissions:
  iranianhardcore.*:
    description: Dastresi be tamam ghabeliat haye Irani - Admin kol
    default: op
    children:
      iranianhardcore.race.*: true
      iranianhardcore.hardcore.*: true
      iranianhardcore.dungeon.*: true
      iranianhardcore.bazaar.*: true
      iranianhardcore.iranian.*: true
      iranianhardcore.admin: true
      iranianhardcore.bypass.*: true
  iranianhardcore.race.*:
    description: Tamam permission haye aghvame Irani
    default: true
    children:
      iranianhardcore.race.choose: true
      iranianhardcore.race.info: true
      iranianhardcore.race.change: true
  iranianhardcore.race.choose:
    description: Entekhab ghome Irani
    default: true
  iranianhardcore.race.info:
    description: Didan etelaat ghome Irani
    default: true
  iranianhardcore.race.change:
    description: Taghir ghome Irani
    default: true
  iranianhardcore.race.admin:
    description: Modiriat ghome digaran - Admin
    default: op
  iranianhardcore.hardcore.*:
    description: Permission haye hardcore Irani
    default: op
  iranianhardcore.iranian.*:
    description: Permission haye Iranian v5.0
    default: true
    children:
      iranianhardcore.iranian.thirst: true
      iranianhardcore.iranian.temperature: true
      iranianhardcore.iranian.drink: true
      iranianhardcore.iranian.resourcepack: true
      iranianhardcore.iranian.spawnmob: true
      iranianhardcore.iranian.swords: true
      iranianhardcore.iranian.foods: true
      iranianhardcore.iranian.items: true
  iranianhardcore.iranian.thirst:
    description: Didan mizan teshnegi
    default: true
  iranianhardcore.iranian.temperature:
    description: Didan dama badan
    default: true
  iranianhardcore.iranian.drink:
    description: Noshidan ab
    default: true
  iranianhardcore.iranian.resourcepack:
    description: Daryaft resource pack Irani
    default: true
  iranianhardcore.iranian.spawnmob:
    description: Sakht mob Irani - Admin
    default: op
  iranianhardcore.iranian.swords:
    description: Dastresi be 900 shamshir Irani
    default: op
  iranianhardcore.iranian.foods:
    description: Dastresi be 500 ghaza Irani
    default: op
  iranianhardcore.iranian.items:
