# ================================
# Iranian Hardcore - Config فارسی کامل - نسخه 3.0
# هر بایوم یک دانجن ایرانی - 16 دانجن + 8 سازه
# 🇮🇷 زنده باد ایران - تاریخ 7000 ساله
# برای 1.12.2 - بدون NMS
# ================================

# تنظیمات کلی - فارسی - نسخه 3.0
general:
  prefix: "&8[&6ایران&8] &r"
  language: "fa" # فقط فارسی
  debug: false
  version: "3.0.0-هر-بایوم-یک-دانجن-ایرانی"
  slogan: "🇮🇷 زنده باد ایران - خلیج همیشه فارس - تاریخ 7000 ساله"

# تنظیمات هاردکور - سخت‌ترین حالت - فارسی
hardcore:
  enabled: true
  health:
    enabled: true
    max-health: 10.0
    disable-natural-regen: true
    faster-hunger: true
    hunger-drain-multiplier: 2.0
    raw-food-poison: true
    raw-food-effects:
      - "POISON:100:1"
      - "CONFUSION:200:0"
      - "HUNGER:300:1"
  resources:
    tool-durability-multiplier: 2.0
    require-correct-tool-for-stone: true
    leaves-need-shears: true
  mobs:
    enabled: true
    double-health: true
    damage-multiplier: 1.5
    double-night-spawn: true
    zombies-break-doors: true
    creeper-stronger-explosion: true
    creeper-explosion-multiplier: 1.8
    spiders-poison: true
    spider-poison-chance: 0.4
    skeletons-more-accurate: true
    skeleton-velocity-multiplier: 1.5
  survival:
    bed:
      enabled: true
      only-at-night: true
      heal-amount: 4.0
      cooldown-days: 3
      cooldown-message: "&cشما اخیراً خوابیده‌اید! باید %days% روز دیگر صبر کنید. &7خواب در فرهنگ ایرانی مقدس است!"
    nether:
      more-dangerous: true
      chance: 0.05
      damage-multiplier: 1.5
    end:
      more-dangerous: true
      chance: 0.03
      void-damage-multiplier: 2.0
    water-lava:
      harder-water: true
      harder-lava: true
      lava-damage-multiplier: 1.5
  death:
    destroy-inventory: true
    clear-exp: true
    respawn-debuffs:
      - "WEAKNESS:1200:1"
      - "SLOW:1200:0"
      - "HUNGER:600:1"

# تنظیمات نژاد ایرانی - 8 نژاد - فارسی
race:
  enabled: true
  force-choose-on-first-join: true
  open-gui-on-first-join: true
  change-cooldown-days: 7
  change-cooldown-message: "&cهر 7 روز یک بار! %days% روز مانده. &7مثل تغییر تابعیت در ایران باستان!"
  biome-effects:
    enabled: true
    check-interval-ticks: 40
  messages:
    choose-first: "&eلطفاً نژاد ایرانی خود را انتخاب کنید! &a/race choose &7- 8 نژاد"
    already-have-race: "&cشما نژاد %race% را دارید! &7ایرانی اصیل!"
    race-selected: "&aنژاد شما به %race% تغییر یافت! &6زنده باد ایران!"

# ================================
# دانجن‌های تاریخی ایران - نسخه 3.0 - هر بایوم یک دانجن
# 🇮🇷 16 دانجن برای پوشش تمام 40+ بایوم 1.12.2
# ================================
dungeons:
  enabled: true
  spawn-chance: 0.006 # 0.6% - کمی بیشتر برای پوشش همه بایوم‌ها
  min-distance: 400 # حداقل فاصله 400 بلوک
  broadcast-discovery: true
  
  # 16 دانجن - هر بایوم پوشش داده شده
  all-biomes-covered: true
  list:
    - "ALAMUT_CASTLE - قلعه الموت - کوهستان"
    - "ANAHITA_TEMPLE - معبد آناهیتا - جنگل"
    - "ARGE_BAM - ارگ بم - بیابان"
    - "BANDAR_SIRAF - بندر سیراف - اقیانوس - خلیج فارس"
    - "GHALEH_BABAK - قلعه بابک - برفی"
    - "CHOGHA_ZANBIL - چغازنبیل - مرداب"
    - "DAKHMEH_ZARTOSHTI - دخمه زرتشتی - ندر"
    - "TAKHT_JAMSHID_SKY - تخت جمشید - اند"
    - "PASARGAD_TOMB - آرامگاه کوروش - دشت"
    - "BISOTUN_INSCRIPTION - کتیبه بیستون - کوه"
    - "NAQSH_ROSTAM - نقش رستم - مِسا"
    - "TAKHT_SOLEYMAN - تخت سلیمان - یخ"
    - "HEGMATANEH - هگمتانه - تایگا"
    - "SUSA_PALACE - کاخ شوش - جنگل توس"
    - "YAZD_JAMEH_MOSQUE - مسجد جامع یزد - بیابان تپه"
    - "AZADI_TOWER - برج آزادی - ساوانا - نماد ایران"

# ================================
# سازه‌های ایرانی روی مپ - نسخه 3.0 - 8 سازه
# بازار، کاروانسرا، چایخانه، آب‌انبار، مسجد، روستا
# ================================
structures:
  enabled: true
  spawn-chance: 0.012 # 1.2% - بیشتر از دانجن
  
  bazaar:
    enabled: true
    persian-name: "بازار ایرانی - حجره‌های سنتی - بازار تهران و اصفهان"
    count: "4 حجره با فروشندگان فارسی"
  
  caravanserai:
    enabled: true
    persian-name: "کاروانسرای شاه عباسی - جاده ابریشم - 999 کاروانسرا"
  
  chaikhaneh:
    enabled: true
    persian-name: "چایخانه سنتی - سماور ذغالی - چای لاهیجان"
  
  ab_anbar:
    enabled: true
    persian-name: "آب‌انبار یزدی - بادگیر کویری - هنر یزدی‌ها"
  
  mosque:
    enabled: true
    persian-name: "مسجد کوچک روستایی - گنبد فیروزه‌ای"
  
  village:
    enabled: true
    persian-name: "روستای ایرانی - کندوان، میمند، ابیانه، ماسوله"

# ================================
# بازار ایرانی - نسخه 3.0 - جدید
# خرید و فروش با سکه دریک هخامنشی
# ================================
bazaar:
  enabled: true
  currency: "GOLD_NUGGET" # سکه دریک
  currency-name: "سکه دریک هخامنشی - اولین سکه جهان - داریوش بزرگ"
  start-coins: 5 # سکه اولیه برای بازیکن جدید
  
  categories:
    weapons:
      name: "⚔ راسته شمشیرگرها - بازار سلاح‌فروشان"
      items:
        - "شمشیر الموت - 20 سکه"
        - "شمشیر بابک - 18 سکه"
        - "آکیناکه هخامنشی - 30 سکه"
        - "کمان آرش - 25 سکه"
    jewels:
      name: "💎 راسته زرگرها - بازار جواهر‌فروشان"
      items:
        - "تاج کوروش - 50 سکه"
        - "مروارید خلیج فارس - 15 سکه"
        - "آتش مقدس - 20 سکه"
    carpets:
      name: "🧶 راسته فرش‌فروشان"
      items:
        - "فرش کرمانی - 10 سکه"
        - "پر سیمرغ - 12 سکه"
    food:
      name: "☕ راسته عطاران"
      items:
        - "چای لاهیجان - 5 سکه"
        - "منشور کوروش - 30 سکه"

# ================================
# روستاهای ایرانی - نسخه 3.0 - جدید
# ================================
villages:
  enabled: true
  transform-vanilla: true # تبدیل روستاهای وانیلا به ایرانی
  persian-names:
    - "کندوان - آذربایجان - خانه‌های صخره‌ای"
    - "میمند - کرمان - 3000 ساله"
    - "ابیانه - اصفهان - سرخ"
    - "ماسوله - گیلان - پلکانی"
    - "پالنگان - کردستان"
    - "روستای خور - اصفهان"
  villager-names:
    - "حاج کریم - کدخدا"
    - "مشهدی حسن - کشاورز"
    - "کربلایی تقی - نانوا"
    - "اصغر آقا - آهنگر"
    - "فاطمه خانم - قالیباف"

