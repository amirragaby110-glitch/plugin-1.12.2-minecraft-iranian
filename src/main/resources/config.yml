# ================================
# Iranian Hardcore - Config v5.0 Finglish + 900 Swords + 500 Foods + 20,000 Items
# Har biome yek ghome Irani - 14 ghom + 30 dungeon + 8 saze + Climate + Thirst + 30 Mobs
# Zende bad Iran - Tarikh 7000 sale - Aghvame Irani
# Baraye 1.12.2 Spigot / Paper / Aternos - 100% Finglish
# ================================

# Tanzimat koli - v5.0 Finglish
general:
  prefix: "&8[&6Iran&8] &r"
  prefix-finglish: "&8[&6Iran&8] &r"
  prefix-fa: "&8[&6Iran&8] &r"
  language: "finglish"
  debug: false
  version: "5.0.0-finglish-edition"
  slogan: "Har biome yek ghome Irani - 14 ghome asil - Zende bad Iran - Khalij hameshe Fars"
  slogan-fa: "Har biome yek ghome Irani - 14 ghome asil - Zende bad Iran - Khalij hameshe Fars"

# Language settings
language:
  current: "finglish"
  available: ["finglish", "en"]

# Tanzimat hardcore - Sakhtarin halat
hardcore:
  enabled: true
  health:
    enabled: true
    max-health: 20.0
    disable-natural-regen: true
    faster-hunger: true
    hunger-drain-multiplier: 2.0
    raw-food-poison: true
    raw-food-effects:
      - "POISON:100:1"
      - "CONFUSION:200:0"
      - "HUNGER:300:1"
  resources:
    tool-durability-multiplier: 2.0
    require-correct-tool-for-stone: true
    leaves-need-shears: true
  mobs:
    enabled: true
    double-health: true
    damage-multiplier: 1.5
    double-night-spawn: true
    zombies-break-doors: false
    creeper-stronger-explosion: true
    creeper-explosion-multiplier: 1.8
    spiders-poison: true
    spider-poison-chance: 0.4
    skeletons-more-accurate: true
    skeleton-velocity-multiplier: 1.5
  survival:
    bed:
      enabled: true
      only-at-night: true
      heal-amount: 4.0
      cooldown-days: 3
      cooldown-message: "Shoma akharan khabideid! Bayad %days% rooz digar sabr konid."
      cooldown-message-fa: "Shoma akharan khabideid! Bayad %days% rooz digar sabr konid."
    nether:
      more-dangerous: true
      chance: 0.05
      damage-multiplier: 1.5
    end:
      more-dangerous: true
      chance: 0.03
      void-damage-multiplier: 2.0
    water-lava:
      harder-water: true
      harder-lava: true
      lava-damage-multiplier: 1.5
  death:
    destroy-inventory: true
    clear-exp: true
    respawn-debuffs:
      - "WEAKNESS:1200:1"
      - "SLOW:1200:0"
      - "HUNGER:600:1"

# ================================
# Climate & Temperature System - v5.0
# Ab o hava sard/garm va fasl haye Irani
# ================================
climate:
  enabled: true
  cold:
    enabled: true
    damage-at: -90
    slow-at: -30
    message-interval: 15
  hot:
    enabled: true
    damage-at: 90
    slow-at: 30
    thirst-drain-multiplier: 1.5
    message-interval: 15
  check-interval-ticks: 60

# ================================
# Thirst System - v5.0 RLCraft Style
# Bazikon bayad ab pakizeh bokhore, vagarna mimire
# ================================
thirst:
  enabled: true
  max-thirst: 100
  start-thirst: 100
  drain-rate: 0.3
  sprint-drain: 0.4
  hot-biome-drain: 1.0
  hardcore-multiplier: 1.5
  slow-at: 40
  critical-at: 20
  damage-at: 0
  message-interval: 20
  water-bottle: 25
  mashk-ab: 30
  enable-mashk: true

# ================================
# Custom Iranian Mobs & Bosses - v5.0 (30 Mobs)
# ================================
mobs:
  custom:
    enabled: true
    spawn-chance: 0.08
    replace-natural: false
    broadcast-rare: true
    boss-broadcast: true

# ================================
# Resource Pack - v5.0
# ================================
resourcepack:
  enabled: true
  auto-send-on-join: false
  url: "https://raw.githubusercontent.com/amirragaby110-glitch/plugin-1.12.2-minecraft-iranian/arena/01a0b98c-plugin-1-12-2-minecraft-irania/IranianHardcore-ResourcePack.zip"
  hash: ""
  prompt: true

# Tanzimat nezhad Irani - 14 ghom - Finglish
race:
  enabled: true
  force-choose-on-first-join: true
  open-gui-on-first-join: true
  change-cooldown-days: 7
  change-cooldown-message: "Har 7 rooz yek bar! %days% rooz mande."
  change-cooldown-message-fa: "Har 7 rooz yek bar! %days% rooz mande."
  biome-effects:
    enabled: true
    check-interval-ticks: 40
  messages:
    choose-first: "Lotfan ghome Irani khod ra entekhab konid! /race choose - 14 ghom"
    choose-first-fa: "Lotfan ghome Irani khod ra entekhab konid! /race choose - 14 ghom"
    already-have-race: "Shoma nezhade %race% ra darid! Irani asil!"
    already-have-race-fa: "Shoma nezhade %race% ra darid! Irani asil!"
    race-selected: "Nezhade shoma be %race% taghir yaft! Zende bad Iran!"
    race-selected-fa: "Nezhade shoma be %race% taghir yaft! Zende bad Iran!"

# Dungeons - 30 dungeon tarikhi
