  change-cooldown-message-fa: "هر 7 روز یک بار! %days% روز مانده."
  biome-effects:
    enabled: true
    check-interval-ticks: 40
  messages:
    choose-first: "Lotfan ghome Irani khod ra entekhab konid! /race choose - 14 ghom"
    choose-first-fa: "لطفاً قوم ایرانی خود را انتخاب کنید! /race choose - 14 قوم"
