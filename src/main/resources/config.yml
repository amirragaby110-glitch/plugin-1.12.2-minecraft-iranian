# ================================
# Iranian Hardcore - Config فارسی کامل
# نسخه 2.0.0 - دانجن‌های تاریخی ایران - برای 1.12.2
# 🇮🇷 زنده باد ایران - تاریخ 2500 ساله
# ================================

# تنظیمات کلی - فارسی
general:
  prefix: "&8[&6ایران&8] &r"
  language: "fa" # فقط فارسی - fa
  debug: false
  version: "2.0.0-ایرانی"

# تنظیمات هاردکور - سخت‌ترین حالت
hardcore:
  enabled: true
  
  # سلامت و گرسنگی - فارسی
  health:
    enabled: true
    max-health: 10.0 # نصف جان (5 قلب) - وانیلا 20 است
    disable-natural-regen: true
    faster-hunger: true
    hunger-drain-multiplier: 2.0 # 2 برابر سریع‌تر گرسنه شود
    raw-food-poison: true
    raw-food-effects:
      - "POISON:100:1"
      - "CONFUSION:200:0"
      - "HUNGER:300:1"

  # مصرف منابع - فارسی
  resources:
    tool-durability-multiplier: 2.0
    require-correct-tool-for-stone: true
    leaves-need-shears: true

  # دشمنان - فارسی
  mobs:
    enabled: true
    double-health: true
    damage-multiplier: 1.5
    double-night-spawn: true
    zombies-break-doors: true
    creeper-stronger-explosion: true
    creeper-explosion-multiplier: 1.8
    spiders-poison: true
    spider-poison-chance: 0.4
    skeletons-more-accurate: true
    skeleton-velocity-multiplier: 1.5

  # محدودیت‌های بقا - فارسی
  survival:
    bed:
      enabled: true
      only-at-night: true
      heal-amount: 4.0 # فقط 2 قلب پر کند
      cooldown-days: 3
      cooldown-message: "&cشما اخیراً خوابیده‌اید! باید %days% روز دیگر صبر کنید. &7خواب در فرهنگ ایرانی مقدس است!"
    
    nether:
      more-dangerous: true
      periodic-effects:
        - "WITHER:100:0"
      chance: 0.05
      damage-multiplier: 1.5
    
    end:
      more-dangerous: true
      periodic-effects:
        - "LEVITATION:60:0"
        - "WEAKNESS:100:0"
      chance: 0.03
      void-damage-multiplier: 2.0

    water-lava:
      harder-water: true
      water-slow-duration: 40
      harder-lava: true
      lava-damage-multiplier: 1.5
      lava-fire-ticks-multiplier: 2

  death:
    destroy-inventory: true
    clear-exp: true
    respawn-debuffs:
      - "WEAKNESS:1200:1"
      - "SLOW:1200:0"
      - "HUNGER:600:1"

# تنظیمات نژاد ایرانی - کاملا فارسی
race:
  enabled: true
  force-choose-on-first-join: true
  open-gui-on-first-join: true
  change-cooldown-days: 7
  change-cooldown-message: "&cشما فقط هر 7 روز می‌توانید نژاد خود را تغییر دهید! %days% روز مانده. &7مثل تغییر تابعیت در ایران باستان!"
  
  biome-effects:
    enabled: true
    check-interval-ticks: 40
    full-power-in-home: true
    weakness-in-hostile: true

  messages:
    choose-first: "&eلطفاً ابتدا نژاد ایرانی خود را انتخاب کنید! &a/race choose &7- 8 نژاد تاریخی"
    already-have-race: "&cشما قبلاً نژاد %race% را دارید! &7به ایران خوش آمدید!"
    race-selected: "&aنژاد شما با موفقیت به %race% تغییر یافت! &6زنده باد ایران!"
    no-race: "&cشما هنوز نژادی انتخاب نکرده‌اید! &7ایرانی نیستی؟"
    info-header: "&8&l&m-------------------\n&6&l اطلاعات نژاد ایرانی شما\n&8&l&m-------------------"

# ================================
# دانجن‌های تاریخی ایران - جدید 2.0
# 🇮🇷 8 دانجن بر اساس تاریخ واقعی ایران
# ================================
dungeons:
  enabled: true
  spawn-chance: 0.005 # 0.5% شانس اسپاون در هر چانک جدید - کم برای جلوگیری از لگ
  min-distance: 500 # حداقل فاصله بین دانجن‌ها (بلوک)
  broadcast-discovery: true # اعلام کشف دانجن به همه
  
  # تنظیمات هر دانجن
  alamut_castle:
    enabled: true
    biomes: ["EXTREME_HILLS", "EXTREME_HILLS_MOUNTAINS", "SMALL_MOUNTAINS"]
    difficulty: 5
    persian-name: "قلعه الموت - آشیانه عقاب"
    history: "قلعه حسن صباح، رهبر اسماعیلیان، 1090 میلادی، قزوین"
  
  anahita_temple:
    enabled: true
    biomes: ["FOREST", "BIRCH_FOREST", "ROOFED_FOREST", "JUNGLE"]
    difficulty: 4
    persian-name: "معبد آناهیتا - الهه آب"
    history: "بزرگترین معبد سنگی ایران، کنگاور کرمانشاه، دوره هخامنشی"
  
  arge_bam:
    enabled: true
    biomes: ["DESERT", "MESA"]
    difficulty: 5
    persian-name: "ارگ بم - بزرگترین بنای خشتی جهان"
    history: "180 هزار متر مربع، 2500 سال قدمت، بم کرمان، یونسکو"
  
  bandar_siraf:
    enabled: true
    biomes: ["OCEAN", "BEACH", "DEEP_OCEAN"]
    difficulty: 4
    persian-name: "بندر سیراف - مروارید خلیج فارس"
    history: "بزرگترین بندر ساسانی، بوشهر، خلیج همیشه فارس"
  
  ghaleh_babak:
    enabled: true
    biomes: ["ICE_PLAINS", "ICE_MOUNTAINS", "COLD_TAIGA"]
    difficulty: 5
    persian-name: "قلعه بابک - دژ بابک خرمدین"
    history: "2300 متر ارتفاع، 22 سال مقاومت، کلیبر آذربایجان"
  
  chogha_zanbil:
    enabled: true
    biomes: ["SWAMPLAND", "RIVER"]
    difficulty: 4
    persian-name: "زیگورات چغازنبیل - 3250 ساله"
    history: "ساخته اونتاش-گال، 1250 قبل از میلاد، شوش خوزستان"
  
  dakhmeh_zartoshti:
    enabled: true
    biomes: ["HELL"]
    difficulty: 5
    persian-name: "دخمه زرتشتی - برج خاموشان"
    history: "آیین 3000 ساله زرتشت، آتشکده آذرگشسب، یزد"
  
  takht_jamshid_sky:
    enabled: true
    biomes: ["SKY"]
    difficulty: 6
    persian-name: "تخت جمشید آسمانی - پارسه"
    history: "باشکوه‌ترین کاخ جهان باستان، 515 قبل از میلاد، مرودشت فارس"

# ================================
# سازه‌های ایرانی روی مپ - جدید 2.0
# بازار، کاروانسرا، چایخانه، آب‌انبار
# ================================
structures:
  enabled: true
  spawn-chance: 0.01 # 1% شانس - بیشتر از دانجن
  
  bazaar:
    enabled: true
    persian-name: "بازار ایرانی - حجره‌های سنتی"
    description: "بازار با فرش‌فروش، چای‌فروش، جواهر‌فروش"
    biomes: ["PLAINS", "DESERT", "SAVANNA"]
  
  caravanserai:
    enabled: true
    persian-name: "کاروانسرای شاه عباسی - جاده ابریشم"
    description: "استراحتگاه کاروانیان، ساخته شاه عباس صفوی"
    biomes: ["DESERT", "MESA"]
  
  chaikhaneh:
    enabled: true
    persian-name: "چایخانه سنتی - سماور و قلیان"
    description: "چایخانه با چای لاهیجان و فرش ایرانی"
    biomes: ["FOREST", "TAIGA", "PLAINS"]
  
  ab_anbar:
    enabled: true
    persian-name: "آب‌انبار یزدی - بادگیر کویری"
    description: "آب‌انبار خنک با بادگیر، هنر یزدی‌ها"
    biomes: ["DESERT"]

